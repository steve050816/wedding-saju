<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>친구 궁합 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 맑고 경쾌한, 친구들이랑 같이 보는 궁합 노트
   IDEA: 여러 사람의 명식표를 나란히 놓고 실로 이은 우정 관계도
   PICTURE: 원 위에 놓인 친구들과 서로를 향한 파란 화살표, 점수 링
   COLOUR and TYPE: 흰 바탕, 코발트 #2459e0, 하늘 #eaf1ff, Noto Serif KR 제목
   LAYOUT: 한 열, 입력 카드 → 점수 → 관계도 → 아끼는 정도 → 만난 시기 → 쌍별 상세 */
:root{color-scheme:light;--bg:#fff;--ink:#0f1e3d;--mute:#5d6b86;--line:#dbe4f5;--blue:#2459e0;--sky:#eaf1ff;--sky2:#f5f8ff;--red:#d9485f;
--wood:#2f9e62;--fire:#e0553f;--earth:#c08a2e;--metal:#7b8698;--water:#2459e0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 80px}
h1,h2,.serif{font-family:"Noto Serif KR",serif;letter-spacing:-.02em}
h1{font-size:clamp(30px,8vw,42px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(23px,6vw,30px);line-height:1.25;margin:0 0 16px;text-wrap:balance}
.hero{padding:44px 0 6px;text-align:center}
.knot{display:flex;justify-content:center;margin:0 auto 20px}
.knot span{width:34px;height:34px;border-radius:50%;border:3px solid var(--blue)}
.knot span+span{margin-left:-12px;border-color:#8fb0ff}
.sub{color:var(--mute);margin:12px 0 0}
.card{background:var(--sky2);border:1px solid var(--line);border-radius:22px;padding:20px}
.who{font:700 15px "Noto Sans KR";margin:0 0 12px;display:flex;align-items:center;gap:8px}
.who i{width:12px;height:12px;border-radius:50%}
.who button{margin-left:auto;background:none;border:1px solid var(--line);border-radius:10px;color:var(--mute);font:14px "Noto Sans KR";min-height:36px;padding:0 12px;cursor:pointer}
.row{display:grid;gap:6px;margin-bottom:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
label{font-size:14px;color:var(--mute)}
input,select{font:16px "Noto Sans KR",sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;font:700 18px "Noto Sans KR",sans-serif;color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 8px 24px #2459e033}
.ghost{width:100%;min-height:50px;border:1.5px dashed #a9bfef;border-radius:18px;background:#fff;color:var(--blue);font:700 16px "Noto Sans KR";cursor:pointer}
.forms{display:grid;gap:12px;margin-top:26px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
section{padding-top:52px}
.c{text-align:center}
.ring{position:relative;width:190px;height:190px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring b{font:800 54px/1 "Noto Serif KR",serif;color:var(--blue)}
.ring small{color:var(--mute);font-size:14px}
.title{font:800 clamp(24px,7vw,32px)/1.25 "Noto Serif KR",serif;margin:16px 0 6px}
.lead{color:var(--mute);margin:0}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.charts h3{margin:0 0 8px;font-size:15px;text-align:center}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cell{background:#fff;border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 0 4px}
.cell b{display:block;font:600 22px/1.2 "Noto Serif KR",serif}
.cell span{font-size:11px;color:var(--mute)}
.cell.me{border-color:var(--blue);box-shadow:0 0 0 2px #2459e022}
.cell.nil b{color:#c5cfe3}
.ph{font-size:11px;color:var(--mute);text-align:center}
.map{background:#fff;border:1px solid var(--line);border-radius:22px;padding:6px}
.map svg{display:block;width:100%;height:auto}
.arrows{display:grid;gap:10px;margin-top:14px}
.arrow{background:var(--sky2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.arrow .h{font-weight:700;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.arrow .h em{font-style:normal;color:var(--blue);background:var(--sky);border-radius:999px;padding:1px 10px;font-size:13px}
.arrow p{margin:6px 0 0;font-size:15px}
.arrow small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.care{display:grid;gap:14px}
.care .vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.care .vs i{display:block;height:10px;border-radius:6px;background:#e3eaf7;overflow:hidden}
.care .vs .l em{display:block;height:100%;margin-left:auto;border-radius:6px}
.care .vs .r em{display:block;height:100%;border-radius:6px}
.care .nm{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.care p{margin:4px 0 0;font-size:14px;color:var(--mute)}
.bars{display:grid;gap:14px}
.bar .top{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:15px}
.bar .top span:last-child{color:var(--blue);white-space:nowrap}
.bar i{display:block;height:9px;border-radius:6px;background:#e3eaf7;overflow:hidden;margin:6px 0}
.bar em{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8fb0ff,var(--blue))}
.bar p{margin:0;font-size:13px;color:var(--mute)}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);border-top:1px solid var(--line);margin:0}
.kv>*{padding:11px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mute);font-size:14px}.kv dd{margin:0}
ul.list{margin:0;padding-left:18px}ul.list li{margin-bottom:8px}
.warn{background:#fff5f6;border-color:#f6d3d9}
.warn h3{margin:0 0 10px;color:var(--red);font-size:17px}
.tag{display:inline-block;background:var(--sky);color:var(--blue);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;margin:0 6px 6px 0}
.yr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px}
.yr span{border:1.5px solid var(--line);border-radius:14px;padding:8px 14px;background:#fff;text-align:center;font-size:13px;color:var(--mute)}
.yr span b{display:block;font:800 24px/1.2 "Noto Serif KR",serif;color:var(--ink)}
.yr span.top{border-color:var(--blue)}.yr span.top b{color:var(--blue)}
.check{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
.check button{min-height:48px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 15px "Noto Sans KR";padding:0 16px;cursor:pointer}
.verdict{margin:14px 0 0;padding:14px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.verdict b{color:var(--blue)}
details.pair{border:1px solid var(--line);border-radius:18px;background:var(--sky2);margin-bottom:10px}
details.pair summary{cursor:pointer;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;gap:10px;min-height:44px;list-style:none}
details.pair summary::-webkit-details-marker{display:none}
details.pair summary span:last-child{color:var(--blue);white-space:nowrap}
details.pair>div{padding:0 18px 18px}
.tl{list-style:none;margin:6px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 4px}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--blue)}
.tl b{display:block;color:var(--blue);font-size:14px;white-space:nowrap}
.tl strong{display:block;font-size:16px}.tl span{font-size:14px;color:var(--mute)}
.foot{font-size:13px;color:var(--mute);text-align:center;margin-top:44px}
#result{display:none}
@media(max-width:420px){.card{padding:16px}.check{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.check button{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.reveal{animation:up .6s ease both}@keyframes up{from{opacity:0;transform:translateY(12px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="knot"><span></span><span></span></div>
    <h1>우리, 사주로 보면<br>어떤 사이?</h1>
    <p class="sub">2명부터 5명까지, 각자의 원국을 세우고<br>서로를 향한 마음을 화살표로 풀어 드려요</p>
  </header>

  <form id="f" autocomplete="off">
    <div class="forms" id="people"></div>
    <div class="forms" style="margin-top:12px">
      <button class="ghost" type="button" id="add">+ 친구 추가</button>
      <button class="btn" type="submit">우리 궁합 보기</button>
    </div>
    <p class="note c">양력 기준이며 절기 경계는 근사값이에요.</p>
  </form>

  <div id="result"></div>
  <p class="foot">모든 결과는 사주의 합·충·원진·형·해·파와 오행 생극으로만 계산돼요. 재미로 보는 콘텐츠예요.</p>
</div>

<script>
{
const ST='甲乙丙丁戊己庚辛壬癸'.split(''),STK='갑을병정무기경신임계'.split('');
const BR='子丑寅卯辰巳午未申酉戌亥'.split(''),BRK='자축인묘진사오미신유술해'.split('');
const EL=['목','화','토','금','수'],ELH=['木','火','土','金','水'],ELC=['--wood','--fire','--earth','--metal','--water'];
const BREL=[4,2,0,0,2,1,1,2,3,3,2,4],TERM=[6,4,6,5,6,6,7,8,8,8,7,7];
const DDI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
const PC=['#2459e0','#e0553f','#2f9e62','#c08a2e','#8a4fd6'];
const se=i=>Math.floor(i/2),md=(a,n)=>((a%n)+n)%n;
const HAP=b=>(13-b)%12,CHUNG=b=>(b+6)%12,WON=b=>[7,6,9,8,11,10,1,0,3,2,5,4][b],HAE=b=>(19-b)%12,PA=b=>[9,4,11,6,1,8,3,10,5,0,7,2][b];
const SAMHAP=(a,b)=>a!==b&&md(a-b,4)===0;
const HYUNG=(a,b)=>{if(a===b)return[4,6,9,11].includes(a);if((a===0&&b===3)||(a===3&&b===0))return true;return[[2,5,8],[1,10,7]].some(x=>x.includes(a)&&x.includes(b))};
const jo=(w,a,b)=>(w.charCodeAt(w.length-1)-0xAC00)%28?a:b;
const $=s=>document.querySelector(s);
const FIRST=['키 크고 반듯해서 믿음직해 보였어요','말투가 부드러워서 금방 편해졌어요','웃음소리가 커서 멀리서도 눈에 띄었어요','조용한데 눈빛이 따뜻해서 궁금했어요','말수는 적은데 묘하게 든든했어요','친근해서 처음 본 사람 같지 않았어요','첫인상이 살짝 차가워서 다가가기 어려웠어요','깔끔하고 세련돼 보였어요','시원시원하게 말 걸어 줘서 금방 친해졌어요','속을 잘 몰라서 오히려 더 궁금했어요'];
const PLACE=['책방, 수목원, 전시회','노래방, 공연장, 루프탑 바','단골 맛집, 동네 카페, 누구네 집','방탈출 카페, 볼링장, 운동 클래스','한강, 바닷가, 심야 카페'];
const HWA=[2,3,4,0,1],WD='일월화수목금토';
const ACT=['전시회·책방 투어','페스티벌·노래방','맛집 탐방·밤새 수다','방탈출·같이 운동','바다 여행·밤 산책'];
const VIBE=['같이 성장하는','같이 있으면 신나는','편하게 기대는','서로 믿고 의지하는','깊은 얘기를 나누는'];
// 화살표(A가 B를 보는 시선): 일간 오행 관계
const VIEW={gen:['챙겨줌','손이 많이 가지만 자꾸 챙겨 주고 싶은 친구'],got:['기댐','힘들 때 제일 먼저 생각나는 든든한 친구'],ctrl:['리드','내가 끌고 가면 잘 따라와 주는 편한 친구'],ctrlby:['존경','어렵지만 배울 게 많은 친구'],same:['닮음','나랑 똑같아서 거울 보는 것 같은 친구']};
const relOf=(x,y)=>x===y?'same':(x+1)%5===y?'gen':(y+1)%5===x?'got':(x+2)%5===y?'ctrl':'ctrlby';

function pillars(y,m,d,hour){
  const before=(m<2)||(m===2&&d<TERM[1]),sy=before?y-1:y;
  const year=[md(sy-4,10),md(sy-4,12)];
  const mb=d>=TERM[m-1]?m%12:(m-1)%12,off=md(mb-2,12);
  const month=[md((year[0]%5)*2+2+off,10),mb];
  const di=md(Math.round((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5)+54,60);
  const day=[di%10,di%12];
  let time=null;if(hour!=null){const hb=Math.floor((hour+1)/2)%12;time=[md((day[0]%5)*2+hb,10),hb]}
  return{year,month,day,time};
}
function person(n,dv,tv,i){
  const[y,m,d]=dv.split('-').map(Number);const hour=tv?Number(tv.split(':')[0]):null;
  const P=pillars(y,m,d,hour);const cnt=[0,0,0,0,0];
  [P.time,P.day,P.month,P.year].forEach(q=>{if(q){cnt[se(q[0])]++;cnt[BREL[q[1]]]++}});
  return{n:n||`친구${i+1}`,i,y,P,cnt,dm:se(P.day[0]),db:P.day[1],strong:cnt.indexOf(Math.max(...cnt)),col:PC[i]};
}
const brRel=(a,b)=>{
  const r=[];
  if(a===b)r.push(['같은 지지',3,`같은 ${BR[a]}${jo(BRK[a],'이라','라')} 생각의 결이 닮았어요.`]);
  if(b===HAP(a))r.push(['육합',12,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]}${jo(BRK[b],'이','가')} 육합(六合)을 이뤄 말 안 해도 통해요.`]);
  else if(SAMHAP(a,b))r.push(['삼합',7,`${BR[a]}·${BR[b]}${jo(BRK[b],'이','가')} 삼합(三合)이라 함께 있으면 기운이 커져요.`]);
  if(b===CHUNG(a))r.push(['충',-10,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]}${jo(BRK[b],'이','가')} 충(沖)해서 고집이 부딪히면 크게 싸워요.`]);
  if(b===WON(a))r.push(['원진',-7,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]}${jo(BRK[b],'은','는')} 원진(怨嗔)이라 사소한 서운함이 오래 남아요.`]);
  if(HYUNG(a,b))r.push(['형',-5,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]} 사이에 형(刑)이 있어 농담이 상처가 되기 쉬워요.`]);
  if(b===HAE(a))r.push(['해',-4,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]}${jo(BRK[b],'은','는')} 해(害)라 한쪽만 맞춰 주는 느낌이 생길 수 있어요.`]);
  if(b===PA(a))r.push(['파',-3,`${BR[a]}${jo(BRK[a],'과','와')} ${BR[b]}${jo(BRK[b],'은','는')} 파(破)라 약속이 자꾸 틀어질 수 있어요.`]);
  return r;
};

// 두 사람 궁합
function pair(A,B){
  const an=A.n,bn=B.n,s1=A.P.day[0],s2=B.P.day[0],ea=A.dm,eb=B.dm;
  let sc=60,talk=55,loyal=60,last=60,fill=40;const good=[],bad=[],gives=[];
  if(Math.abs(s1-s2)===5){sc+=12;talk+=30;good.push(`일간 ${ST[s1]}·${ST[s2]}${jo(STK[s2],'이','가')} 천간합(天干合)이라 처음부터 묘하게 편했을 거예요.`)}
  if(Math.abs(s1-s2)===6&&Math.min(s1,s2)<4){sc-=8;talk-=20;bad.push(`일간 ${ST[s1]}·${ST[s2]}${jo(STK[s2],'은','는')} 천간충이라 의견이 갈리면 둘 다 물러서지 않아요.`)}
  const r=relOf(ea,eb);
  if(r==='same'){sc+=5;talk+=12}else if(r==='gen'||r==='got'){sc+=8;talk+=18}else{sc-=4;talk-=6}
  for(const x of brRel(A.db,B.db)){sc+=x[1];loyal+=x[1]*3;(x[1]>0?good:bad).push('속마음 자리(일지): '+x[2])}
  for(const x of brRel(A.P.year[1],B.P.year[1])){sc+=Math.round(x[1]/2);last+=x[1]*2;(x[1]>0?good:bad).push(`띠(${DDI[A.P.year[1]]}·${DDI[B.P.year[1]]}): `+x[2])}
  for(const x of brRel(A.P.month[1],B.P.month[1])){sc+=Math.round(x[1]/3);last+=x[1]*1.5;talk+=x[1];(x[1]>0?good:bad).push('생활 리듬(월지): '+x[2])}
  if(A.P.time&&B.P.time)for(const x of brRel(A.P.time[1],B.P.time[1]))if(Math.abs(x[1])>=7){sc+=Math.round(x[1]/4);(x[1]>0?good:bad).push('꿈과 계획(시지): '+x[2])}
  for(let i=0;i<5;i++){
    if(A.cnt[i]===0&&B.cnt[i]>=2){fill+=15;gives.push(`${an}에게 없는 ${EL[i]}(${ELH[i]})${jo(EL[i],'을','를')} ${bn}${jo(bn,'이','가')} 채워 줘요`)}
    if(B.cnt[i]===0&&A.cnt[i]>=2){fill+=15;gives.push(`${bn}에게 없는 ${EL[i]}(${ELH[i]})${jo(EL[i],'을','를')} ${an}${jo(an,'이','가')} 채워 줘요`)}
  }
  sc+=Math.min(9,gives.length*3);
  const fun=35+(A.cnt[1]+B.cnt[1])*9+(A.cnt[0]+B.cnt[0])*4+(A.cnt[4]+B.cnt[4])*3;
  const cl=v=>Math.max(15,Math.min(98,Math.round(v)));
  sc=Math.max(35,Math.min(99,Math.round(sc)));
  const cats=[['대화 케미',cl(talk),'일간끼리의 합·충과 오행 생극'],['같이 놀 때 텐션',cl(fun),'두 사람의 화·목·수 기운'],['위기 때 의리',cl(loyal),'속마음 자리(일지)끼리의 관계'],['오래 가는 정도',cl(last),'띠(년지)와 생활 리듬(월지)'],['서로 채워 주기',cl(fill),'한쪽에 없는 오행을 상대가 가졌는지']];
  // 아끼는 정도 (방향성)
  const care=(X,Y)=>{let v=55;const why=[];const rr=relOf(X.dm,Y.dm);
    if(rr==='gen'){v+=15;why.push(`${X.n}의 ${EL[X.dm]}${jo(EL[X.dm],'이','가')} ${Y.n}${jo(Y.n,'을','를')} 키워 줘요`)}
    if(rr==='ctrl'){v+=6;why.push('리드하면서 은근히 신경 써요')}
    if(rr==='got'){v+=4}
    if(X.cnt[Y.dm]===0){v+=10;why.push(`${X.n}에게 없는 ${EL[Y.dm]} 기운을 가진 사람이라 더 소중해요`)}
    if(Y.db===HAP(X.db)){v+=8;why.push('속마음 자리가 합이라 마음이 쉽게 가요')}
    if(X.P.day[0]%2===1){v+=5;why.push('음간이라 마음을 오래 품어요')}
    if(X.cnt[(X.dm+1)%5]>=2){v+=5;why.push('표현하는 기운(식상)이 많아 티를 많이 내요')}
    if(Y.db===WON(X.db)||Y.db===CHUNG(X.db))v-=6;
    return{v:Math.max(30,Math.min(97,v)),why}};
  return{A,B,sc,cats,good,bad,gives,r,care:[care(A,B),care(B,A)]};
}

// 시기 예측: 연지가 모두의 일지·띠와 얼마나 맞는지
function meetYears(G){
  const cy=new Date().getFullYear(),y0=Math.max(...G.map(x=>x.y))+7;const out=[];
  for(let Y=Math.min(y0,cy);Y<=cy;Y++){const b=md(Y-4,12),s=md(Y-4,10);let v=0;
    for(const X of G){if(b===HAP(X.db))v+=3;else if(SAMHAP(b,X.db))v+=1.5;if(b===HAP(X.P.year[1]))v+=1;if(b===CHUNG(X.db))v-=2;if(Math.abs(s-X.P.day[0])===5)v+=1}
    const youngAge=Y-Math.max(...G.map(x=>x.y));if([8,14,17,20].includes(youngAge))v+=.6;
    out.push({Y,v,g:ST[s]+BR[b]})}
  return out.sort((a,b)=>b.v-a.v||b.Y-a.Y);
}
function meetMonth(G,Y){let bm=3,bs=-99;for(let M=1;M<=12;M++){const b=M%12;let v=0;for(const X of G){if(b===HAP(X.db))v+=3;else if(SAMHAP(b,X.db))v+=1;if(b===CHUNG(X.db))v-=2}if([3,9].includes(M))v+=.4;if(v>bs){bs=v;bm=M}}return bm}
function explainYear(G,Y){const b=md(Y-4,12),s=md(Y-4,10),g=ST[s]+BR[b];const lines=[];
  for(const X of G){if(b===HAP(X.db))lines.push(`${X.n}의 일지 ${BR[X.db]}${jo(BRK[X.db],'과','와')} 합`);else if(SAMHAP(b,X.db))lines.push(`${X.n}의 일지 ${BR[X.db]}${jo(BRK[X.db],'과','와')} 삼합`);if(b===CHUNG(X.db))lines.push(`${X.n}의 일지 ${BR[X.db]}${jo(BRK[X.db],'과','와')} 충`)}
  return{g,lines}}

// 입력 카드
let N=0;
function addPerson(v={}){

  const d=document.createElement('div');d.className='card';d.dataset.i=i;
  d.innerHTML=`<p class="who" style="color:${PC[i]}"><i style="background:${PC[i]}"></i>${i===0?'나':'친구 '+i}${i>=2?'<button type="button" class="rm">삭제</button>':''}</p>
  <div class="row"><label for="n${i}">이름</label><input id="n${i}" placeholder="${i===0?'예: 다연':'예: 현지'}" maxlength="10" value="${(v.n||'').replace(/"/g,'')}"></div>
  <div class="two"><div class="row"><label for="d${i}">생년월일 (양력)</label><input id="d${i}" type="date" required min="1930-01-01" max="2020-12-31" value="${v.d||''}"></div>
  <div class="row"><label for="t${i}">태어난 시간</label><input id="t${i}" type="time" value="${v.t||''}"></div></div>

function renumber(){const old=[...document.querySelectorAll('#people .card')].map(c=>{const i=c.dataset.i;return{n:$('#n'+i).value,d:$('#d'+i).value,t:$('#t'+i).value}});$('#people').innerHTML='';N=0;old.forEach(addPerson)}
function readAll(){return[...document.querySelectorAll('#people .card')].map(c=>{const i=c.dataset.i;return{n:$('#n'+i).value.trim(),d:$('#d'+i).value,t:$('#t'+i).value}})}

function diagram(G,P){
  const W=340,H=G.length===2?190:G.length===3?320:370,cx=W/2,cy=H/2,R=G.length===2?110:G.length===3?115:140;
  const pos=G.map((_,i)=>{if(G.length===2)return[cx+(i?R:-R)*0.9,cy];const a=-Math.PI/2+i*2*Math.PI/G.length;return[cx+R*Math.cos(a),cy+R*Math.sin(a)*0.9]});
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="서로를 향한 마음 관계도"><defs>${G.map((X,i)=>`<marker id="ah${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="${X.col}"/></marker>`).join('')}</defs>`;
  const labels=[];
  for(const p of P)for(const[X,Y,k]of[[p.A,p.B,0],[p.B,p.A,1]]){
    const[x1,y1]=pos[X.i],[x2,y2]=pos[Y.i],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,off=12;
    const sx=x1+ux*30+nx*off,sy=y1+uy*30+ny*off,ex=x2-ux*32+nx*off,ey=y2-uy*32+ny*off;
    s+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="${X.col}" stroke-width="2" marker-end="url(#ah${X.i})" opacity=".85"/>`;
    const t=G.length>=4?.2:.45,o=G.length>=4?9:12,lx=sx+(ex-sx)*t+nx*o,ly=sy+(ey-sy)*t+ny*o;
    labels.push(`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="${G.length>=4?11:12}" font-weight="700" fill="${X.col}" paint-order="stroke" stroke="#fff" stroke-width="4">${VIEW[relOf(X.dm,Y.dm)][0]}</text>`);
  }
  s+=labels.join('');
  s+=G.map((X,i)=>{const[x,y]=pos[i];return`<circle cx="${x}" cy="${y}" r="26" fill="#fff" stroke="${X.col}" stroke-width="3"/><text x="${x}" y="${y-2}" text-anchor="middle" font-size="13" font-weight="700" fill="${X.col}">${X.n.slice(0,4)}</text><text x="${x}" y="${y+13}" text-anchor="middle" font-size="11" fill="#5d6b86">${ST[X.P.day[0]]}${EL[X.dm]}</text>`}).join('');
  return s+'</svg>';
}

function run(e){
  e&&e.preventDefault();
  const raw=readAll().filter(x=>x.d);if(raw.length<2)return;
  try{localStorage.setItem('fg2',JSON.stringify(readAll()))}catch(_){}
  const G=raw.map((x,i)=>person(x.n,x.d,x.t,i));
  const P=[];for(let i=0;i<G.length;i++)for(let j=i+1;j<G.length;j++)P.push(pair(G[i],G[j]));
  const avg=Math.round(P.reduce((a,p)=>a+p.sc,0)/P.length);
  const names=G.map(x=>x.n).join(' · ');
  const title=avg>=90?'전생부터 이어진 사이':avg>=80?'말 안 해도 통하는 찐친':avg>=70?'오래 갈 든든한 사이':avg>=58?'티격태격해도 결국 같이 있는 사이':'다르기에 배울 게 많은 사이';
  const tot=[0,1,2,3,4].map(i=>G.reduce((a,X)=>a+X.cnt[i],0));
  const order=[0,1,2,3,4].sort((x,y)=>tot[y]-tot[x]);
  const best=[...P].sort((a,b)=>b.sc-a.sc)[0];

  // 그룹 역할
  const maxBy=f=>{const v=G.map(f),m=Math.max(...v);return v.filter(x=>x===m).length===G.length?null:G[v.indexOf(m)]};
  const firstCall=maxBy(X=>X.cnt[1]+(X.P.day[0]%2?0:1));
  const late=maxBy(X=>X.cnt[4]);
  const payer=maxBy(X=>X.cnt[2]+X.cnt[3]);
  const mood=maxBy(X=>X.cnt[1]+X.cnt[0]*0.5);
  const sorry=maxBy(X=>(X.P.day[0]%2)+X.cnt[0]*.5+X.cnt[4]*.5);
  const plan=maxBy(X=>X.cnt[3]+X.cnt[2]*.5);
  const roles=[['연락 먼저 하는',firstCall,'화(火) 기운과 양간이 가장 강해요'],['분위기 메이커',mood,'화·목 기운이 가장 많아요'],['계획 짜는',plan,'금(金) 기운이 가장 강해 꼼꼼해요'],['계산하는',payer,'토·금 기운이 많아 셈이 정확해요'],['약속에 늦는',late,'수(水) 기운이 많아 느긋해요'],['먼저 사과하는',sorry,'음간이거나 목·수 기운이 많아 마음이 먼저 약해져요']];

  // 함께하는 날
  const dsc=t=>{const q=pillars(t.getFullYear(),t.getMonth()+1,t.getDate(),null).day;let s=0;const why=[];
    for(const X of G){if(q[1]===HAP(X.db))s+=3;else if(SAMHAP(q[1],X.db))s+=1.5;if(q[1]===CHUNG(X.db)){s-=3;why.push(`${X.n}의 일지 ${BR[X.db]}${jo(BRK[X.db],'과','와')} 충`)}if(q[1]===WON(X.db)){s-=2;why.push(`${X.n}의 일지 ${BR[X.db]}${jo(BRK[X.db],'과','와')} 원진`)}if(Math.abs(q[0]-X.P.day[0])===5)s+=2}
    return{s,q,why}};
  const today=new Date();today.setHours(0,0,0,0);
  const days=[...Array(150)].map((_,i)=>{const t=new Date(today);t.setDate(t.getDate()+i+1);return{t,...dsc(t)}});
  const pick=(arr,f)=>arr.reduce((a,b)=>f(b)>f(a)?b:a);
  const meetD=pick(days.slice(0,45).filter(d=>d.t.getDay()===6),d=>d.s);
  const fight=pick(days.slice(0,120),d=>-d.s),fi=days.indexOf(fight);
  const makeup=pick(days.slice(fi+3,fi+15),d=>d.s);
  const tripD=pick(days.slice(45).filter(d=>d.t.getDay()===6),d=>d.s);
  const peakD=pick(days.filter(d=>![meetD,tripD,makeup,fight].includes(d)),d=>d.s);
  const fd=t=>`${t.getFullYear()}.${t.getMonth()+1}.${t.getDate()} (${WD[t.getDay()]})`;
  const story=[[meetD.t,'다음에 모이기 좋은 날',`${ST[meetD.q[0]]+BR[meetD.q[1]]}일 · 모두의 일지와 가장 잘 맞는 토요일`],
    [fight.t,'싸우기 쉬운 날',fight.why.length?`${fight.why.join(', ')}이 걸려요. 예민한 얘기는 피하세요.`:'다들 기운이 가라앉는 날이에요. 말 한마디를 조심하세요.'],
    [makeup.t,'화해하기 좋은 날','싸운 뒤 가장 기운이 풀리는 날이에요. 먼저 연락해 보세요.'],
    [peakD.t,'우정 최고조','모두의 일지와 합이 드는 날이라 무엇을 해도 잘 맞아요'],
    [tripD.t,'같이 여행 가기 좋은 날','몇 달 안에 가장 기운이 좋은 토요일이에요']].sort((x,y)=>x[0]-y[0]);
  let hb=7,hs=-99;for(const b of [5,6,7,8,9,10,11]){let s=0;for(const X of G){if(b===HAP(X.db))s+=3;else if(SAMHAP(b,X.db))s+=1.5;if(b===CHUNG(X.db))s-=3}if(s>hs){hs=s;hb=b}}
  const hh=x=>x<12?`오전 ${x}시`:x===12?'낮 12시':`오후 ${x-12}시`;
  const plEl=tot.indexOf(Math.min(...tot));

  // 만난 시기
  const MY=meetYears(G),top3=MY.slice(0,3),mm=meetMonth(G,top3[0].Y);
  const season=m=>[12,1,2].includes(m)?'겨울':m<=5?'봄':m<=8?'여름':'가을';

  const pcell=(q,k,me)=>q?`<div class="cell${me?' me':''}"><b style="color:var(${ELC[k?BREL[q[1]]:se(q[0])]})">${k?BR[q[1]]:ST[q[0]]}</b><span>${k?BRK[q[1]]+EL[BREL[q[1]]]:STK[q[0]]+EL[se(q[0])]}</span></div>`:`<div class="cell nil"><b>?</b><span>모름</span></div>`;
  const chart=X=>{const cols=[X.P.time,X.P.day,X.P.month,X.P.year];return`<div class="card"><h3 style="color:${X.col}">${X.n}</h3><div class="g4">${['시','일','월','년'].map(t=>`<div class="ph">${t}</div>`).join('')}${cols.map((q,i)=>pcell(q,0,i===1)).join('')}${cols.map((q,i)=>pcell(q,1,i===1)).join('')}</div></div>`};
  const R=72,C=2*Math.PI*R;
  const arrowsHtml=P.flatMap(p=>[[p.A,p.B,p.care[0]],[p.B,p.A,p.care[1]]]).map(([X,Y,c])=>{const rr=relOf(X.dm,Y.dm),br=brRel(X.db,Y.db)[0];
    return`<div class="arrow"><div class="h"><span style="color:${X.col}">${X.n}</span> → <span style="color:${Y.col}">${Y.n}</span><em>${VIEW[rr][0]}</em></div>
    <p>${X.n}에게 ${Y.n}${jo(Y.n,'은','는')} <b>${VIEW[rr][1]}</b>${br?`이고, ${br[1]>0?'말 안 해도 통하는 사람':'가끔 이해 안 되는 사람'}이에요`:'예요'}.</p>
    <small>첫인상: ${FIRST[Y.P.day[0]]} · ${X.n}의 ${EL[X.dm]}${jo(EL[X.dm],'과','와')} ${Y.n}의 ${EL[Y.dm]} 관계로 봤어요</small></div>`}).join('');
  const careHtml=P.map(p=>{const[a,b]=p.care,more=a.v===b.v?null:a.v>b.v?p.A:p.B,mc=more===p.A?a:b;
    return`<div><div class="nm"><span style="color:${p.A.col}">${p.A.n} ${a.v}%</span><span style="color:${p.B.col}">${b.v}% ${p.B.n}</span></div>
    <div class="vs"><span class="l"><i><em style="width:${a.v}%;background:${p.A.col}"></em></i></span><span>♥</span><span class="r"><i><em style="width:${b.v}%;background:${p.B.col}"></em></i></span></div>
    <p>${more?`<b style="color:${more.col}">${more.n}</b>${jo(more.n,'이','가')} 조금 더 아껴요. ${mc.why.slice(0,2).join(', ')||'마음이 더 기울어 있어요'}.`:'둘이 똑같이 아껴요.'}</p></div>`}).join('');
  const pairHtml=[...P].sort((a,b)=>b.sc-a.sc).map(p=>{const my=meetYears([p.A,p.B])[0];return`<details class="pair"><summary><span>${p.A.n} × ${p.B.n}</span><span>${p.sc}점</span></summary><div>
    <div class="bars">${p.cats.map(c=>`<div class="bar"><div class="top"><span>${c[0]}</span><span>${c[1]}점</span></div><i><em style="width:${c[1]}%"></em></i><p>${c[2]}</p></div>`).join('')}</div>
    <dl class="kv" style="margin-top:14px">
      <dt>채워 주기</dt><dd>${p.gives.length?p.gives.join('. ')+'.':'비어 있는 오행이 비슷해서 같은 걸 함께 즐기는 사이예요.'}</dd>
      <dt>잘 맞는 점</dt><dd>${p.good.length?`<ul class="list">${p.good.map(x=>`<li>${x}</li>`).join('')}</ul>`:'크게 끌어당기는 합은 없지만 부담 없이 지내요.'}</dd>
      <dt>조심할 점</dt><dd>${p.bad.length?`<ul class="list">${p.bad.map(x=>`<li>${x}</li>`).join('')}</ul>`:'크게 부딪히는 충·원진이 없어요.'}</dd>
      <dt>만난 시기</dt><dd>사주로는 ${my.Y}년(${my.g})이 가장 유력해요</dd>
    </dl></div></details>`}).join('');
  const allBad=P.flatMap(p=>p.bad.filter(x=>/충|원진/.test(x)).map(x=>`${p.A.n}·${p.B.n} ${x}`));

  $('#result').innerHTML=`
  <section class="c reveal">
    <div class="ring"><svg viewBox="0 0 180 180"><circle cx="90" cy="90" r="${R}" fill="none" stroke="#e3eaf7" stroke-width="14"/><circle cx="90" cy="90" r="${R}" fill="none" stroke="#2459e0" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-avg/100)}"/></svg><div><b>${avg}</b><small>${G.length>2?'평균 ':''}우정 궁합</small></div></div>
    <p class="title">${title}</p>
    <p class="lead">${names} · ${VIBE[order[0]]} ${G.length>2?'모임':'친구'}</p>
    ${G.length>2?`<p class="note">가장 잘 맞는 둘: <b>${best.A.n} × ${best.B.n}</b> (${best.sc}점)</p>`:''}
  </section>

  <section class="reveal"><h2 class="c">각자의 사주 원국</h2><div class="charts">${G.map(chart).join('')}</div></section>

  <section class="reveal">
    <h2 class="c">서로를 어떻게 생각할까</h2>
    <div class="map">${diagram(G,P)}</div>
    <p class="note c">화살표는 그 사람이 상대를 바라보는 마음이에요. 일간 오행의 생극으로 봤어요.</p>
    <div class="arrows">${arrowsHtml}</div>
  </section>

  <section class="reveal">
    <h2 class="c">누가 더 아낄까</h2>
    <div class="card care">${careHtml}</div>
    <p class="note c">상대를 생(生)해 주는지, 나에게 없는 오행을 가졌는지, 속마음 자리가 합인지, 표현하는 기운이 많은지로 봤어요.</p>
  </section>

  <section class="reveal">
    <h2 class="c">우리가 처음 만난 시기</h2>
    <div class="card c">
      <p style="margin:0">사주로 맞혀 본 ${G.length>2?'모두가':'두 사람이'} 만났을 해</p>
      <div class="yr">${top3.map((x,i)=>`<span class="${i?'':'top'}"><b>${x.Y}</b>${x.g}년${i?'':` · ${mm}월 무렵`}</span>`).join('')}</div>
      <p class="note" style="margin:0 0 14px">${top3[0].Y}년 ${season(mm)}이 가장 유력해요. ${(l=>l.length?`그해에는 ${l.join(', ')}이 들어 있었어요.`:'그해 기운이 모두와 부드럽게 맞았어요.')(explainYear(G,top3[0].Y).lines.slice(0,3))}</p>
      <div class="check" style="text-align:left">
        <div class="row" style="margin:0"><label for="ry">실제로 만난 해</label><input id="ry" type="number" inputmode="numeric" placeholder="예: 2019" min="1940" max="${new Date().getFullYear()}"></div>
        <div class="row" style="margin:0"><label for="rm">월 (선택)</label><select id="rm"><option value="">모름</option>${[...Array(12)].map((_,i)=>`<option>${i+1}</option>`).join('')}</select></div>
        <button type="button" id="chk">맞춰 보기</button>
      </div>
      <div id="verdict"></div>
    </div>
  </section>

  <section class="reveal">
    <h2 class="c">우리 안의 역할</h2>
    <div class="card"><dl class="kv">${roles.map(r=>`<dt>${r[0]}</dt><dd>${r[1]?`<b style="color:${r[1].col}">${r[1].n}</b> · ${r[2]}`:'다 비슷해요 · 기운이 고르게 나뉘어 있어요'}</dd>`).join('')}
      <dt>모이는 곳</dt><dd>${PLACE[plEl]} · 다 같이 부족한 ${EL[plEl]}(${ELH[plEl]}) 기운을 채워요</dd>
      <dt>모이는 시간</dt><dd>${BR[hb]}시 (${hh(2*hb-1)}~${hh((2*hb+1)%24||24)}) · 모두의 일지와 가장 잘 맞아요</dd>
      <dt>같이 하면</dt><dd>${[ACT[order[0]],ACT[order[1]]].map(a=>`<span class="tag">${a}</span>`).join('')}</dd></dl></div>
  </section>

  <section class="reveal">
    <h2 class="c">우정 타임라인</h2>
    <div class="card"><ol class="tl">${story.map(x=>`<li><b>${fd(x[0])}</b><strong>${x[1]}</strong><span>${x[2]}</span></li>`).join('')}</ol>
    <p class="note">앞으로 다섯 달 동안 매일의 간지를 모두의 일지·일간과 맞춰 봤어요.</p></div>
  </section>

  <section class="reveal">
    <h2 class="c">둘씩 자세히 보기</h2>
    ${pairHtml}
  </section>

  ${allBad.length?`<section class="reveal"><div class="card warn"><h3>이럴 땐 조심해요</h3><ul class="list">${allBad.slice(0,6).map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`:''}`;
  $('#result').style.display='block';
  $('#chk').onclick=()=>{
    const Y=Number($('#ry').value),M=Number($('#rm').value)||null,v=$('#verdict');
    if(!Y||Y<1940||Y>new Date().getFullYear()){v.innerHTML='<p class="verdict">만난 해를 숫자로 넣어 주세요.</p>';return}
    const rank=MY.findIndex(x=>x.Y===Y)+1,ex=explainYear(G,Y);
    const hit=rank&&rank<=3,monthHit=M&&rank===1&&Math.abs(M-mm)<=1;
    v.innerHTML=`<div class="verdict" style="text-align:left">${hit?`<b>맞혔어요! ${rank}순위 예측이에요.</b>${monthHit?' 달까지 거의 맞았어요.':''}`:`<b>사주 예측과는 달랐어요</b> (${rank?rank+'번째 후보':'예측 범위 밖'}).`}
      <p style="margin:6px 0 0">${Y}년은 ${ex.g}년이에요. ${ex.lines.length?ex.lines.join(', ')+'이 들어 있었어요. ':''}${ex.lines.some(l=>l.endsWith('충'))?'처음엔 어색하거나 부딪혔지만 그 덕에 오히려 강하게 기억에 남은 만남이에요.':hit?'모두의 기운이 열려 있던 해라 자연스럽게 가까워졌어요.':ex.lines.length?`${ex.lines[0].split('의')[0]}의 기운이 열려 있던 해라, 그쪽에서 먼저 다가갔을 가능성이 커요.`:'특별한 합이 없던 해라, 사주보다 우연과 노력으로 이어진 인연이에요.'}</p></div>`;
  };
  $('#result').scrollIntoView({behavior:'smooth'});
}
$('#add').addEventListener('click',()=>addPerson());
$('#f').addEventListener('submit',run);
let saved=null;try{saved=JSON.parse(localStorage.getItem('fg2')||'null')}catch(_){}
if(saved&&saved.length>=2)saved.forEach(addPerson);else{addPerson();addPerson()}
}
</script>
</body>
