<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결혼 사주 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정하고 은근히 설레는, 밤에 혼자 보는 운세 노트
   IDEA: 붉은 실로 묶인 청첩장 + 만세력 명식표
   PICTURE: 붉은 실이 이어주는 사주 원국 8칸, 결혼운 곡선, 만남 달력
   COLOUR and TYPE: 깊은 밤색 바탕, 분홍 실 #f07fae, 오행 색, Noto Serif KR 제목
   LAYOUT: 한 열, 입력 → 원국 → 결혼운 → 배우자 → 만남 → 피할 인연 */
:root{color-scheme:dark;--bg:#0c0a0d;--card:#17121a;--line:#33242f;--ink:#f3eaf0;--mute:#a8969f;--pink:#f07fae;--pink2:#ffc2da;--red:#ef5d5d;
--wood:#5fbf7f;--fire:#ef6a5a;--earth:#d9a54c;--metal:#cfd3dc;--water:#5c9cf0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 80px}
h1,h2,.serif{font-family:"Noto Serif KR",serif;letter-spacing:-.02em}
h1{font-size:clamp(30px,8vw,42px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,6.4vw,32px);line-height:1.2;margin:0 0 18px;text-wrap:balance}
.hero{padding:48px 0 8px;text-align:center}
.thread{width:2px;height:56px;margin:0 auto 22px;background:linear-gradient(transparent,var(--pink))}
.sub{color:var(--mute);margin:12px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}
form .row{display:grid;gap:6px;margin-bottom:14px}
label{font-size:14px;color:var(--mute)}
input,select{font:16px "Noto Sans KR",sans-serif;color:var(--ink);background:#0f0c11;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;font:700 18px "Noto Sans KR",sans-serif;color:#3a0f22;background:linear-gradient(180deg,#ffc2da,#f07fae);cursor:pointer;box-shadow:0 8px 30px #f07fae40}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
section{padding-top:56px}
.c{text-align:center}
.lead{font-size:17px;color:var(--mute);margin:-8px 0 20px}
.grid8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ph{font-size:13px;color:var(--mute);text-align:center}
.cell{border:1px solid var(--line);border-radius:16px;background:#0f0c11;text-align:center;padding:12px 4px 10px;position:relative}
.cell b{display:block;font:600 clamp(28px,8vw,38px)/1.2 "Noto Serif KR",serif}
.cell span{font-size:13px}
.cell.me{border-color:var(--pink);box-shadow:0 0 24px #f07fae55 inset}
.cell.nil b{color:#4a3d45}
.tag{display:block;text-align:center;font-size:13px;color:var(--pink);font-weight:700;margin-top:6px}
.bars{display:grid;gap:8px;margin-top:22px}
.bar{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2em;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:10px;border-radius:6px;background:#241b22;overflow:hidden}
.bar i em{display:block;height:100%;border-radius:6px}
.big{font:800 clamp(40px,12vw,64px)/1.05 "Noto Serif KR",serif;color:var(--pink2);margin:6px 0}
.fig{position:relative;height:240px;margin:8px -6px 0}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);border-top:1px solid var(--line)}
.kv>*{padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mute);font-size:14px}.kv dd{margin:0}
.mbti{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 18px}
.mbti div{border:1.5px solid var(--line);border-radius:14px;text-align:center;padding:10px 0 6px}
.mbti b{font:800 30px/1.2 "Noto Serif KR",serif;color:var(--pink2);display:block}
.mbti small{font-size:12px;color:var(--mute)}
.stars{color:var(--pink);letter-spacing:2px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:15px}
.cal .h{font-size:12px;color:var(--mute);padding-bottom:6px}
.cal .d{padding:8px 0;border-radius:12px;position:relative}
.cal .soft{background:#2a1b25}
.cal .good{background:#1d3328;color:#bfe8cf}
.cal .hit{background:var(--pink);color:#3a0f22;font-weight:800;box-shadow:0 0 22px var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mute);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.dday{font:800 clamp(34px,10vw,48px)/1 "Noto Serif KR",serif;color:var(--pink2)}
.read p{margin:0 0 14px}.read h3{font-size:15px;color:var(--pink);margin:18px 0 6px}
.avoid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.avoid .card{padding:16px;border-color:#4a2222;background:#170d0e}
.avoid h3{margin:0 0 8px;font-size:16px;color:var(--red)}
.avoid p{margin:0;font-size:14px;color:#d8c6c6}
.quote{font-family:"Noto Serif KR",serif;font-size:18px;color:var(--pink2)}
.foot{font-size:13px;color:var(--mute);text-align:center;margin-top:48px}
.again{margin-top:20px;background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none}
#result{display:none}
.face{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a2a35,#140f15);margin-bottom:14px;display:grid;place-items:center}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face svg{width:55%;opacity:.5}
.face .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;text-align:center;font-size:14px;color:#f3eaf0;background:linear-gradient(transparent,#000a)}
.face.load::after{content:"그리는 중…";position:absolute;inset:0;display:grid;place-items:center;background:#0008;font-weight:700;color:var(--pink2)}
.ai{display:grid;gap:8px;margin-bottom:16px}
.ai .btn{min-height:48px;font-size:16px}
details{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;min-height:32px}
details input{margin-top:6px}
.err{color:#ff9b9b;font-size:13px;margin:0}
@media(max-width:420px){.avoid{grid-template-columns:minmax(0,1fr)}.card{padding:18px}}
@media(prefers-reduced-motion:no-preference){.reveal{animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="thread"></div>
    <h1>내 사주에 적힌<br>결혼 이야기</h1>
    <p class="sub">생년월일시로 사주 원국을 세우고<br>배우자궁과 결혼운의 흐름을 읽어 드려요</p>
  </header>

  <form id="f" class="card" style="margin-top:28px" autocomplete="off">
    <div class="row"><label for="nm">이름</label><input id="nm" placeholder="예: 김다연" maxlength="12"></div>
    <div class="row"><label for="bd">생년월일 (양력)</label><input id="bd" type="date" required min="1930-01-01" max="2015-12-31"></div>
    <div class="two">
      <div class="row"><label for="bt">태어난 시간</label><input id="bt" type="time"></div>
      <div class="row"><label for="unk">시간 모름</label><select id="unk"><option value="0">시간 알아요</option><option value="1">모름</option></select></div>
    </div>
    <div class="two">
      <div class="row"><label for="sx">내 성별</label><select id="sx"><option value="F">여성</option><option value="M">남성</option></select></div>
      <div class="row"><label for="px">인연의 성별</label><select id="px"><option value="auto">자동</option><option value="M">남성</option><option value="F">여성</option></select></div>
    </div>
    <button class="btn" type="submit">내 결혼 사주 보기</button>
    <p class="note">양력 기준이며, 절기 경계는 근사값이에요. 절기 당일 출생자는 월주가 하루 차이 날 수 있어요.</p>
  </form>

  <div id="result"></div>
  <p class="foot">재미로 보는 콘텐츠예요. 같은 입력엔 늘 같은 결과가 나오지만, 과학적 근거는 없어요.</p>
</div>

<script>
{
const ST='甲乙丙丁戊己庚辛壬癸'.split(''),STK='갑을병정무기경신임계'.split('');
const BR='子丑寅卯辰巳午未申酉戌亥'.split(''),BRK='자축인묘진사오미신유술해'.split('');
const EL=['목','화','토','금','수'],ELH=['木','火','土','金','水'],ELC=['--wood','--fire','--earth','--metal','--water'];
const BREL=[4,2,0,0,2,1,1,2,3,3,2,4];
const TERM=[6,4,6,5,6,6,7,8,8,8,7,7];
const se=i=>Math.floor(i/2), md=(a,n)=>((a%n)+n)%n;
const HAP=b=>(13-b)%12, CHUNG=b=>(b+6)%12;
const $=s=>document.querySelector(s);

function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
function rng(seed){let a=hash(seed)();return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function pillars(y,m,d,hour){
  const before=(m<2)||(m===2&&d<TERM[1]);
  const sy=before?y-1:y;
  const year=[md(sy-4,10),md(sy-4,12)];
  let mb=d>=TERM[m-1]?m%12:(m-1)%12;
  const off=md(mb-2,12);
  const month=[md((year[0]%5)*2+2+off,10),mb];
  const days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5);
  const di=md(days+54,60);
  const day=[di%10,di%12];
  let time=null;
  if(hour!=null){const hb=Math.floor((hour+1)/2)%12;time=[md((day[0]%5)*2+hb,10),hb]}
  return{year,month,day,time};
}

const PERS=[
 {k:'곧고 따뜻한',desc:'말수는 적어도 한번 마음을 열면 끝까지 챙기는 사람',job:'교육·기획·콘텐츠',body:'키가 크고 마른',first:'단정하고 차분함',drink:'분위기만 즐기는 정도',place:'서점이나 전시회',line:'"이 책, 저도 좋아하는데요."',mb:['N','F','P']},
 {k:'밝고 열정적인',desc:'표현이 확실하고 함께 있으면 공기가 환해지는 사람',job:'마케팅·디자인·방송',body:'균형 잡힌 탄탄한',first:'웃는 얼굴이 먼저 기억남',drink:'가볍게 즐기는 정도',place:'공연장이나 페스티벌',line:'"혹시 혼자 오셨어요?"',mb:['N','F','P']},
 {k:'듬직하고 한결같은',desc:'약속을 지키는 게 자연스러운, 기대어 쉬기 좋은 사람',job:'공공기관·HR·부동산',body:'어깨가 넓은 듬직한',first:'편안하고 믿음직함',drink:'거의 안 마심',place:'동네 단골 카페나 소모임',line:'"자주 오시죠? 늘 그 자리에 계시던데."',mb:['S','F','J']},
 {k:'반듯하고 똑부러진',desc:'계획이 분명하고 내 사람에게만 다정한 반전형',job:'엔지니어·금융·법조',body:'슬림하고 반듯한',first:'깔끔하고 살짝 차가움',drink:'회식 때만 조금',place:'회사, 스터디, 학회',line:'"자료 정리하신 거, 정말 잘 보이던데요."',mb:['S','T','J']},
 {k:'깊고 유연한',desc:'생각이 깊고 대화가 끊이지 않는, 볼수록 궁금한 사람',job:'연구·IT·무역',body:'날렵하고 유연한',first:'눈빛이 깊고 신비로움',drink:'와인 한두 잔 정도',place:'강변 산책로나 여행지',line:'"여기 노을 진짜 예쁘죠."',mb:['N','T','P']}
];
const AVOID=[
 ['처음엔 뜨거운데 금방 식는 사람','연락이 몰아치다 어느 날 뚝 끊겨요. 속도가 너무 빠르면 한 번 멈춰 보세요.'],
 ['같이 있으면 즐거운데 미래가 안 그려지는 사람','재미는 확실하지만 현실 얘기만 나오면 피해요.'],
 ['나를 바꾸려 드는 사람','처음엔 조언 같지만 점점 내 색이 지워져요.'],
 ['말과 행동이 다른 사람','약속이 자주 미뤄진다면 그게 답이에요.'],
 ['과거에 머물러 있는 사람','전 인연 이야기가 자주 나온다면 아직 자리가 없는 거예요.']
];

function chart(el,scores,years,peak){
  const s=el.querySelector('svg');
  const draw=()=>{
    const W=s.clientWidth,H=s.clientHeight,p=28,b=34,top=40;
    const x=i=>p+i*(W-2*p)/(years.length-1),y=v=>top+(1-v/100)*(H-top-b);
    const pts=scores.map((v,i)=>[x(i),y(v)]);
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=1;i<pts.length;i++){const[a,c]=[pts[i-1],pts[i]],mx=(a[0]+c[0])/2;d+=` C${mx},${a[1]} ${mx},${c[1]} ${c[0]},${c[1]}`}
    const pk=pts[peak];
    s.innerHTML=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f07fae" stop-opacity=".45"/><stop offset="1" stop-color="#f07fae" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${pts.at(-1)[0]},${H-b} L${pts[0][0]},${H-b}Z" fill="url(#g)"/>
    <path d="${d}" fill="none" stroke="#f07fae" stroke-width="2.5"/>
    <line x1="${pk[0]}" x2="${pk[0]}" y1="${pk[1]}" y2="${H-b}" stroke="#f07fae" stroke-dasharray="3 4"/>
    ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===peak?7:4}" fill="${i===peak?'#ffc2da':'#0c0a0d'}" stroke="#f07fae" stroke-width="2"/>`).join('')}
    <text x="${Math.min(Math.max(pk[0],44),W-44)}" y="${pk[1]-16}" text-anchor="middle" fill="#ffc2da" font-size="13" font-weight="700">결혼운 최고</text>
    ${years.map((t,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="13" fill="${i===peak?'#f07fae':'#a8969f'}" font-weight="${i===peak?700:400}">${W<380?String(t).slice(2):t}</text>`).join('')}`;
  };
  const ro=new ResizeObserver(draw);ro.observe(s);
}

const VIBE=['gentle and calm, neat hair, warm eyes','bright and cheerful, big warm smile','reliable and kind, soft round features','sharp and clean-cut, composed expression','deep thoughtful eyes, slightly mysterious'];
let cur=null;
async function genFace(){
  const key=$('#gk').value.trim(),model=$('#gm').value.trim()||'gemini-3.1-flash-image',err=$('#err'),box=$('#face');
  err.textContent='';
  if(!key){$('#keybox').open=true;err.textContent='Gemini API 키를 먼저 넣어 주세요.';return}
  try{localStorage.setItem('gk',key);localStorage.setItem('gm',model)}catch(_){}
  const who=cur.px==='M'?'man':'woman',dec=Math.max(20,Math.round(cur.age));
  const prompt=`Photorealistic portrait photo of a fictional Korean ${who}, about ${dec} years old, ${cur.vibe}, ${cur.body.includes('키') ? 'tall' : 'natural'} build, wearing a simple dark jacket, soft studio light, light grey background, upper body, facing the camera with a gentle smile, 85mm lens, shallow depth of field. Not a real person or celebrity. No text.`;
  box.classList.add('load');$('#gen').disabled=true;
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseModalities:['IMAGE'],imageConfig:{aspectRatio:'3:4'}}})});
    const j=await r.json();
    if(!r.ok)throw new Error(j.error?.message||('HTTP '+r.status));
    const part=(j.candidates?.[0]?.content?.parts||[]).find(p=>p.inlineData||p.inline_data);
    if(!part)throw new Error('이미지가 오지 않았어요. 다시 눌러 보세요.');
    const d=part.inlineData||part.inline_data;
    box.querySelector('img')?.remove();
    const im=new Image();im.alt='AI가 그린 배우자 얼굴';im.src=`data:${d.mimeType||d.mime_type};base64,${d.data}`;
    box.prepend(im);box.querySelector('svg').style.display='none';
    $('#gen').textContent='다시 그려보기';
  }catch(e){
    err.textContent=e instanceof TypeError?'여기서는 외부 API 호출이 막혀 있어요. 다운로드한 HTML 파일을 브라우저로 열어서 써 주세요.':'오류: '+e.message;
  }finally{box.classList.remove('load');$('#gen').disabled=false}
}

function sats(y,m){const out=[],n=new Date(y,m,0).getDate();for(let d=1;d<=n;d++)if(new Date(y,m-1,d).getDay()===6)out.push(d);return out}

function run(e){
  e&&e.preventDefault();
  const v=$('#bd').value;if(!v)return;
  const[y,m,d]=v.split('-').map(Number);
  const unk=$('#unk').value==='1'||!$('#bt').value;
  const hour=unk?null:Number($('#bt').value.split(':')[0]);
  const name=$('#nm').value.trim()||'당신';
  const sx=$('#sx').value;let px=$('#px').value;if(px==='auto')px=sx==='F'?'M':'F';
  try{localStorage.setItem('ws',JSON.stringify({nm:$('#nm').value,bd:v,bt:$('#bt').value,unk:$('#unk').value,sx,px:$('#px').value}))}catch(_){}
  const R=rng(v+'|'+hour+'|'+sx+'|'+name);
  const P=pillars(y,m,d,hour);
  const dm=se(P.day[0]),dayBr=P.day[1];
  const spouseEl=sx==='F'?(dm+3)%5:(dm+2)%5;
  const killEl=sx==='F'?(dm+1)%5:dm;

  // 오행 분포
  const cnt=[0,0,0,0,0];
  [P.time,P.day,P.month,P.year].forEach(q=>{if(q){cnt[se(q[0])]++;cnt[BREL[q[1]]]++}});
  const total=cnt.reduce((a,b)=>a+b,0);

  // 결혼운 흐름
  const now=new Date(),cy=now.getFullYear();
  const years=[...Array(6)].map((_,i)=>cy+i);
  const scores=years.map(Y=>{
    const s=md(Y-4,10),b=md(Y-4,12);let v=38+R()*12;
    if(se(s)===spouseEl)v+=24; if(BREL[b]===spouseEl)v+=14;
    if(b===HAP(dayBr))v+=18; if(b===CHUNG(dayBr))v-=14;
    const age=Y-y; if(age<24)v-=(24-age)*3; if(age>=27&&age<=34)v+=6;
    return Math.max(12,Math.min(96,Math.round(v)));
  });
  const peak=scores.indexOf(Math.max(...scores));const wy=years[peak];
  let best=0,wm=5;
  for(let M=1;M<=12;M++){if(wy===cy&&M<=now.getMonth()+3)continue;
    const b=M%12;let s=R()*10;if(b===HAP(dayBr))s+=20;if(BREL[b]===spouseEl)s+=14;if([4,5,9,10,11].includes(M))s+=8;if(b===CHUNG(dayBr))s-=12;
    if(s>best){best=s;wm=M}}
  const wsat=sats(wy,wm),wd=wsat[Math.floor(R()*wsat.length)];

  // 만남
  let mt=new Date(wy,wm-1-(10+Math.floor(R()*9)),1);
  const minM=new Date(cy,now.getMonth()+1,1);if(mt<minM)mt=minM;
  const my=mt.getFullYear(),mm=mt.getMonth()+1;
  const msat=sats(my,mm),md0=msat[Math.min(msat.length-1,1+Math.floor(R()*(msat.length-1)))];
  const meet=new Date(my,mm-1,md0);
  const dday=Math.ceil((meet-new Date(cy,now.getMonth(),now.getDate()))/864e5);
  const hours=['오전 11시','오후 2시','오후 4시','저녁 6시','저녁 7시'];const mh=hours[Math.floor(R()*hours.length)];

  // 배우자
  const pol=P.day[0]%2,sStem=spouseEl*2+(1-pol);
  const pr=PERS[spouseEl];
  const mb=[R()<.55?'I':'E',...pr.mb.map((c,i)=>R()<.2?(['SN','TF','JP'][i].replace(c,'')):c)];
  const gap=Math.floor(R()*8)-2;
  const gapTxt=gap===0?'동갑':gap>0?`${gap}살 연상`:`${-gap}살 연하`;
  const ht=px==='M'?172+Math.floor(R()*14):156+Math.floor(R()*13);
  const st=()=>{const n=3+Math.floor(R()*3);return'★'.repeat(n)+'☆'.repeat(5-n)};
  const match=86+Math.floor(R()*13);
  const ex=[...AVOID].sort(()=>R()-.5).slice(0,2);
  const avAge=[Math.floor(R()*5)+1,Math.floor(R()*7)+2];

  const cell=(q,i,lbl)=>q?`<div class="cell${lbl==='일주'&&i===1?' me':''}"><b style="color:var(${ELC[i===0?se(q[0]):BREL[q[1]]]})">${i===0?ST[q[0]]:BR[q[1]]}</b><span>${i===0?STK[q[0]]+EL[se(q[0])]:BRK[q[1]]+EL[BREL[q[1]]]}</span></div>`:`<div class="cell nil"><b>?</b><span>모름</span></div>`;
  const cols=[['시주',P.time],['일주',P.day],['월주',P.month],['년주',P.year]];

  // 달력
  const first=new Date(my,mm-1,1).getDay(),nd=new Date(my,mm,0).getDate(),lead=(first+6)%7;
  let cal='월화수목금토일'.split('').map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(lead);
  for(let i=1;i<=nd;i++){let c='d';if(i===md0)c+=' hit';else if(i>=md0-6&&i<md0-2)c+=' soft';else if(i>md0&&i<=md0+5)c+=' good';cal+=`<div class="${c}">${i}</div>`}

  const pxw=px==='M'?'그 사람':'그 사람';
  $('#result').innerHTML=`
  <section class="c reveal"><div class="thread"></div>
    <h2>${name}님의 배우자궁에<br>전부 나와 있어요</h2>
    <div class="card">
      <div class="grid8">${cols.map(c=>`<div class="ph">${c[0]}</div>`).join('')}
        ${cols.map(c=>cell(c[1],0,c[0])).join('')}${cols.map(c=>cell(c[1],1,c[0])).join('')}</div>
      <div class="grid8"><span></span><span class="tag">배우자궁</span></div>
      <div class="bars">${cnt.map((n,i)=>`<div class="bar"><span>${EL[i]} ${ELH[i]}</span><i><em style="width:${n/total*100}%;background:var(${ELC[i]})"></em></i><span>${n}</span></div>`).join('')}</div>
      <p class="note" style="text-align:left">일간은 <b style="color:var(${ELC[dm]})">${ST[P.day[0]]}${EL[dm]}</b>, 배우자궁(일지)은 <b style="color:var(${ELC[BREL[dayBr]]})">${BR[dayBr]}${EL[BREL[dayBr]]}</b>이에요. ${sx==='F'?'여성은 나를 다스리는 기운(관성)':'남성은 내가 다스리는 기운(재성)'}이 배우자를 뜻하는데, ${name}님에겐 <b>${EL[spouseEl]}(${ELH[spouseEl]})</b>이 그 자리예요.</p>
    </div>
  </section>

  <section class="c reveal">
    <h2>결혼운은 언제 열릴까?</h2>
    <p class="big">${wy}년 ${wm}월 ${wd}일</p>
    <p class="lead">토요일, 결혼운이 가장 높은 해의 길한 달이에요</p>
    <div class="card"><div class="fig" id="fig"><svg role="img" aria-label="연도별 결혼운 흐름"></svg></div></div>
    <div class="card read" style="text-align:left;margin-top:12px">
      <h3>기점</h3><p>${wy}년은 ${se(md(wy-4,10))===spouseEl||BREL[md(wy-4,12)]===spouseEl?`배우자를 뜻하는 ${EL[spouseEl]} 기운이 들어오는 해`:md(wy-4,12)===HAP(dayBr)?`배우자궁 ${BR[dayBr]}와 합(合)을 이루는 ${BR[md(wy-4,12)]}년`:'흐름이 가장 부드럽게 열리는 해'}예요. 그 전까진 타이밍이 아니었을 뿐이에요.</p>
      <h3>조심할 해</h3><p>${(()=>{const c=years.find(Y=>md(Y-4,12)===CHUNG(dayBr));return c?`${c}년은 배우자궁과 충(沖)이 있어 관계가 흔들리기 쉬워요. 큰 결정은 한 템포 늦추는 게 좋아요.`:'앞으로 6년 안에 배우자궁을 크게 흔드는 해는 없어요.'})()}</p>
    </div>
  </section>

  <section class="reveal">
    <h2 class="c">그 사람은 어떤 사람일까?</h2>
    <div class="card">
      <div class="face" id="face"><svg viewBox="0 0 100 110" fill="#f07fae"><circle cx="50" cy="36" r="22"/><path d="M8 110c0-28 19-42 42-42s42 14 42 42z"/></svg><div class="cap">배우자궁에 들어온 단 한 사람</div></div>
      <div class="ai">
        <button class="btn" type="button" id="gen">AI로 얼굴 그려보기</button>
        <p class="err" id="err"></p>
        <details id="keybox"><summary>Gemini API 키 설정</summary>
          <label for="gk">API 키 (이 브라우저에만 저장돼요)</label><input id="gk" type="password" placeholder="AIza...">
          <label for="gm" style="display:block;margin-top:8px">모델</label><input id="gm" value="gemini-3.1-flash-image">
        </details>
      </div>
      <p class="c" style="margin:0;color:var(--mute);font-size:14px">매칭 지수</p>
      <p class="c big" style="margin:0 0 14px">${match}점</p>
      <div class="mbti">${mb.map((c,i)=>`<div><b>${c}</b><small>${['외향/내향','감각/직관','사고/감정','판단/인식'][i]}</small></div>`).join('')}</div>
      <dl class="kv">
        <dt>일간</dt><dd><b style="color:var(${ELC[spouseEl]})">${ST[sStem]}${EL[spouseEl]}</b> · ${pr.k} 기운</dd>
        <dt>나이 차</dt><dd>${gapTxt}</dd>
        <dt>키</dt><dd>${ht}cm 안팎</dd>
        <dt>체형</dt><dd>${pr.body} 체형</dd>
        <dt>첫인상</dt><dd>${pr.first}</dd>
        <dt>직업군</dt><dd>${pr.job}</dd>
        <dt>음주</dt><dd>${pr.drink}</dd>
        <dt>성격</dt><dd>${pr.desc}</dd>
        <dt>다정함</dt><dd class="stars">${st()}</dd>
        <dt>성실함</dt><dd class="stars">${st()}</dd>
        <dt>유머</dt><dd class="stars">${st()}</dd>
      </dl>
    </div>
  </section>

  <section class="reveal">
    <h2 class="c">인연이 오는 날</h2>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <div><div class="serif" style="font-size:22px">${my}년 ${mm}월</div><div style="color:var(--mute);font-size:14px">그 사람은 언제 나타날까?</div></div>
        <div class="dday">D-${dday}</div></div>
      <div class="cal">${cal}</div>
      <div class="legend"><span><i style="background:#2a1b25"></i>기운이 돌기 시작</span><span><i style="background:var(--pink)"></i>만남운 최고</span><span><i style="background:#1d3328"></i>약속 잡기 좋은 날</span></div>
      <dl class="kv" style="margin-top:18px">
        <dt>만나는 곳</dt><dd>${pr.place}</dd>
        <dt>시간대</dt><dd>${mm}월 ${md0}일 토요일 ${mh} 무렵</dd>
        <dt>첫마디</dt><dd class="quote">${pr.line}</dd>
      </dl>
    </div>
  </section>

  <section class="reveal">
    <h2 class="c" style="color:var(--red)">단, 피해야 할<br>사람들도 있어요</h2>
    <p class="c lead">${EL[killEl]}(${ELH[killEl]}) 기운이 너무 강한 사람은 ${name}님의 배우자 기운을 약하게 만들어요</p>
    <div class="avoid">${ex.map((a,i)=>`<div class="card"><h3>${avAge[i]}살 ${i?'연상':'연하'}</h3><p><b>${a[0]}</b><br>${a[1]}</p></div>`).join('')}</div>
    <button class="btn again" type="button" id="again">다시 입력하기</button>
  </section>`;
  $('#result').style.display='block';
  chart($('#fig'),scores,years,peak);
  $('#again').onclick=()=>{window.scrollTo({top:0,behavior:'smooth'})};
  const age=(cy-y)+gap;
  cur={px,age,vibe:VIBE[spouseEl],body:pr.body};
  try{$('#gk').value=localStorage.getItem('gk')||'';$('#gm').value=localStorage.getItem('gm')||$('#gm').value}catch(_){}
  if(!$('#gk').value)$('#keybox').open=true;
  $('#gen').onclick=genFace;
  $('#result').scrollIntoView({behavior:'smooth'});
}
$('#f').addEventListener('submit',run);
$('#unk').addEventListener('change',()=>{$('#bt').disabled=$('#unk').value==='1'});
try{const s=JSON.parse(localStorage.getItem('ws')||'null');if(s){$('#nm').value=s.nm||'';$('#bd').value=s.bd||'';$('#bt').value=s.bt||'';$('#unk').value=s.unk||'0';$('#sx').value=s.sx||'F';$('#px').value=s.px||'auto';$('#bt').disabled=s.unk==='1'}}catch(_){}
window.__p=pillars;
}
</script>
</body>
</html>
