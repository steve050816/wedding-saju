<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>결혼 사주 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 다정하고 은근히 설레는, 밤에 혼자 보는 운세 노트
   IDEA: 붉은 실로 묶인 청첩장 + 만세력 명식표
   PICTURE: 붉은 실이 이어주는 사주 원국 8칸, 결혼운 곡선, 만남 달력
   COLOUR and TYPE: 깊은 밤색 바탕, 분홍 실 #f07fae, 오행 색, Noto Serif KR 제목
   LAYOUT: 한 열, 입력 → 원국 → 결혼운 → 배우자 → 만남 → 피할 인연 */
:root{color-scheme:dark;--bg:#0c0a0d;--card:#17121a;--line:#33242f;--ink:#f3eaf0;--mute:#a8969f;--pink:#f07fae;--pink2:#ffc2da;--red:#ef5d5d;
--wood:#5fbf7f;--fire:#ef6a5a;--earth:#d9a54c;--metal:#cfd3dc;--water:#5c9cf0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 80px}
h1,h2,.serif{font-family:"Noto Serif KR",serif;letter-spacing:-.02em}
h1{font-size:clamp(30px,8vw,42px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:clamp(24px,6.4vw,32px);line-height:1.2;margin:0 0 18px;text-wrap:balance}
.hero{padding:48px 0 8px;text-align:center}
.thread{width:2px;height:56px;margin:0 auto 22px;background:linear-gradient(transparent,var(--pink))}
.sub{color:var(--mute);margin:12px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px}
form .row{display:grid;gap:6px;margin-bottom:14px}
label{font-size:14px;color:var(--mute)}
input,select{font:16px "Noto Sans KR",sans-serif;color:var(--ink);background:#0f0c11;border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 14px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.btn{width:100%;min-height:56px;border:0;border-radius:18px;font:700 18px "Noto Sans KR",sans-serif;color:#3a0f22;background:linear-gradient(180deg,#ffc2da,#f07fae);cursor:pointer;box-shadow:0 8px 30px #f07fae40}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}
section{padding-top:56px}
.c{text-align:center}
.lead{font-size:17px;color:var(--mute);margin:-8px 0 20px}
.grid8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ph{font-size:13px;color:var(--mute);text-align:center}
.cell{border:1px solid var(--line);border-radius:16px;background:#0f0c11;text-align:center;padding:12px 4px 10px;position:relative}
.cell b{display:block;font:600 clamp(28px,8vw,38px)/1.2 "Noto Serif KR",serif}
.cell span{font-size:13px}
.cell.me{border-color:var(--pink);box-shadow:0 0 24px #f07fae55 inset}
.cell.nil b{color:#4a3d45}
.tag{display:block;text-align:center;font-size:13px;color:var(--pink);font-weight:700;margin-top:6px}
.bars{display:grid;gap:8px;margin-top:22px}
.bar{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2em;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:10px;border-radius:6px;background:#241b22;overflow:hidden}
.bar i em{display:block;height:100%;border-radius:6px}
.big{font:800 clamp(40px,12vw,64px)/1.05 "Noto Serif KR",serif;color:var(--pink2);margin:6px 0}
.fig{position:relative;height:240px;margin:8px -6px 0}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);border-top:1px solid var(--line)}
.kv>*{padding:12px 0;border-bottom:1px solid var(--line)}
.kv dt{color:var(--mute);font-size:14px}.kv dd{margin:0}
.mbti{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:6px 0 18px}
.mbti div{border:1.5px solid var(--line);border-radius:14px;text-align:center;padding:10px 0 6px}
.mbti b{font:800 30px/1.2 "Noto Serif KR",serif;color:var(--pink2);display:block}
.mbti small{font-size:12px;color:var(--mute)}
.stars{color:var(--pink);letter-spacing:2px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:15px}
.cal .h{font-size:12px;color:var(--mute);padding-bottom:6px}
.cal .d{padding:8px 0;border-radius:12px;position:relative}
.cal .soft{background:#2a1b25}
.cal .good{background:#1d3328;color:#bfe8cf}
.cal .hit{background:var(--pink);color:#3a0f22;font-weight:800;box-shadow:0 0 22px var(--pink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mute);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.dday{font:800 clamp(34px,10vw,48px)/1 "Noto Serif KR",serif;color:var(--pink2)}
.read p{margin:0 0 14px}.read h3{font-size:15px;color:var(--pink);margin:18px 0 6px}
.avoid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.avoid .card{padding:16px;border-color:#4a2222;background:#170d0e}
.avoid h3{margin:0 0 8px;font-size:16px;color:var(--red)}
.avoid p{margin:0;font-size:14px;color:#d8c6c6}
.bad{display:grid;gap:12px}
.bad .card{border-color:#4a2222;background:#170d0e}
.bad h3{margin:0;font-size:19px;color:#ffb3b3}
.bad .meta{font-size:14px;color:#c9a6a6;margin:2px 0 10px}
.risk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;color:#c9a6a6}
.risk i{height:8px;border-radius:5px;background:#2a1517;overflow:hidden}.risk em{display:block;height:100%;background:var(--red)}
.bad ul{margin:12px 0 0;padding-left:18px;font-size:15px;color:#ead6d6}.bad li{margin-bottom:6px}
.bad .tip{margin:10px 0 0;font-size:14px;color:#d8c6c6;border-top:1px solid #3a2023;padding-top:10px}
.quote{font-family:"Noto Serif KR",serif;font-size:18px;color:var(--pink2)}
.foot{font-size:13px;color:var(--mute);text-align:center;margin-top:48px}
.again{margin-top:20px;background:none;border:1px solid var(--line);color:var(--ink);box-shadow:none}
#result{display:none}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 4px}
.tl li::before{content:"";position:absolute;left:-25px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--pink)}
.tl li.end::before{background:var(--pink)}
.tl b{display:block;color:var(--pink2);font-size:14px;white-space:nowrap}
.tl span{font-size:15px}
.map{background:#0f0c11;border:1px solid var(--line);border-radius:16px;margin-top:16px;padding:6px}
.map svg{display:block;width:100%;height:auto}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{flex:1 1 140px;text-align:center;min-height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--pink2);text-decoration:none;font-weight:700;font-size:15px}
.face{position:relative;aspect-ratio:3/4;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3a2a35,#140f15);margin-bottom:14px;display:grid;place-items:center}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face svg{width:55%;opacity:.5}
.face .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 12px;text-align:center;font-size:14px;color:#f3eaf0;background:linear-gradient(transparent,#000a)}
.face.load::after{content:"그리는 중…";position:absolute;inset:0;display:grid;place-items:center;background:#0008;font-weight:700;color:var(--pink2)}
.ai{display:grid;gap:8px;margin-bottom:16px}
.ai .btn{min-height:48px;font-size:16px}
details{font-size:14px;color:var(--mute)}
details summary{cursor:pointer;min-height:32px}
details input{margin-top:6px}
.err{color:#ff9b9b;font-size:13px;margin:0}
@media(max-width:420px){.avoid{grid-template-columns:minmax(0,1fr)}.card{padding:18px}}
@media(prefers-reduced-motion:no-preference){.reveal{animation:up .7s ease both}@keyframes up{from{opacity:0;transform:translateY(14px)}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="thread"></div>
    <h1>내 사주에 적힌<br>결혼 이야기</h1>
    <p class="sub">생년월일시로 사주 원국을 세우고<br>배우자궁과 결혼운의 흐름을 읽어 드려요</p>
  </header>

  <form id="f" class="card" style="margin-top:28px" autocomplete="off">
    <div class="row"><label for="nm">이름</label><input id="nm" placeholder="예: 김다연" maxlength="12"></div>
    <div class="row"><label for="bd">생년월일 (양력)</label><input id="bd" type="date" required min="1930-01-01" max="2015-12-31"></div>
    <div class="two">
      <div class="row"><label for="bt">태어난 시간</label><input id="bt" type="time"></div>
      <div class="row"><label for="unk">시간 모름</label><select id="unk"><option value="0">시간 알아요</option><option value="1">모름</option></select></div>
    </div>
    <div class="two">
      <div class="row"><label for="sx">내 성별</label><select id="sx"><option value="F">여성</option><option value="M">남성</option></select></div>
      <div class="row"><label for="px">인연의 성별</label><select id="px"><option value="auto">자동</option><option value="M">남성</option><option value="F">여성</option></select></div>
    </div>
    <div class="two">
      <div class="row"><label for="sd">사는 곳</label><select id="sd"></select></div>
      <div class="row"><label for="sg">시·군·구</label><select id="sg"></select></div>
    </div>
    <div class="row"><label for="rs">지금 나는</label><select id="rs"><option value="S">솔로</option><option value="D">연애 중</option><option value="M">기혼</option></select></div>
    <button class="btn" type="submit">내 결혼 사주 보기</button>
    <p class="note">양력 기준이며, 절기 경계는 근사값이에요. 절기 당일 출생자는 월주가 하루 차이 날 수 있어요.</p>
  </form>

  <div id="result"></div>
  <p class="foot">모든 결과는 사주 원국의 합·충·원진과 오행으로만 계산돼요. 재미로 보는 콘텐츠이고, 과학적 근거는 없어요.</p>
</div>

function pillars(y,m,d,hour){
  const before=(m<2)||(m===2&&d<TERM[1]);
  const sy=before?y-1:y;
  const year=[md(sy-4,10),md(sy-4,12)];
  let mb=d>=TERM[m-1]?m%12:(m-1)%12;
  const off=md(mb-2,12);
  const month=[md((year[0]%5)*2+2+off,10),mb];
  const days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(2000,0,1))/864e5);
  const di=md(days+54,60);
  const day=[di%10,di%12];
  let time=null;
  if(hour!=null){const hb=Math.floor((hour+1)/2)%12;time=[md((day[0]%5)*2+hb,10),hb]}
  return{year,month,day,time};
}

    $('#gen').textContent='다시 그려보기';

      <div class="risk"><span>궁합 위험도</span><i><em style="width:${x.risk}%"></em></i><b>${x.risk}%</b></div>
      <ul>${x.r.map(r=>`<li>${r[3]}</li>`).join('')}<li>특히 ${BADT[BREL[x.b]]} 모습이 보이면 더 조심하세요.</li></ul>
      <p class="tip">${rel==='S'?'이미 끌린다면':'이 띠와 함께라면'}: ${TIP[x.main[1]]||'서로의 속도를 존중하고, 중요한 건 미루지 말고 대화하세요.'}</p>

    <button class="btn again" type="button" id="again">다시 입력하기</button>

  $('#result').style.display='block';

}
const fillSg=()=>{$('#sg').innerHTML=REG[$('#sd').value].map(q=>`<option>${q[0]}</option>`).join('')};
$('#sd').innerHTML=Object.keys(REG).map(k=>`<option>${k}</option>`).join('');fillSg();

$('#f').addEventListener('submit',run);
$('#unk').addEventListener('change',()=>{$('#bt').disabled=$('#unk').value==='1'});
try{const s=JSON.parse(localStorage.getItem('ws')||'null');if(s){$('#nm').value=s.nm||'';$('#bd').value=s.bd||'';$('#bt').value=s.bt||'';$('#unk').value=s.unk||'0';$('#sx').value=s.sx||'F';$('#px').value=s.px||'auto';$('#rs').value=s.rs||'S';if(REG[s.sd]){$('#sd').value=s.sd;fillSg();$('#sg').value=s.sg||REG[s.sd][0][0]}$('#bt').disabled=s.unk==='1'}}catch(_){}
window.__p=pillars;
}
